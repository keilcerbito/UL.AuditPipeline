name: Deploy Bicep Infrastructure

on:
  push:
    branches:
      - main

# Required permissions for OIDC token generation
permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          az group create --name rg-ulaudit-dev --location southeastasia

      - name: Deploy Bicep File
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-ulaudit-dev
          template: ./Infrastructure/main.bicep
          parameters: location=southeastasia environmentName=dev appName=ulauditpipeline
