name: Deploy Bicep Infrastructure

on:
  push:
    branches:
      - main

# Required permissions for OIDC token generation
permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          az group create --name rg-ulauditpipeline-dev --location southeastasia

      # Infrastructure as Code Deployment
      - name: Deploy Bicep File
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: rg-ulauditpipeline-dev
          template: ./Infrastructure/main.bicep
          parameters: location=southeastasia environmentName=dev appName=ulauditpipeline

      # Build and Deploy .NET Application
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      # Compile and Publish the Web API
      - name: Build and Publish API
        run: dotnet publish ./UL.AuditPipeline.Api/UL.AuditPipeline.Api.csproj -c Release -o ./publish-api

      # Deploy the Web API to Azure App Service
      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ulauditpipeline-dev
          package: ./publish-api
